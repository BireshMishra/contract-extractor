[project]
name = "contract-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Biresh Kumar Mishra", email = "biresh.mishra@gteladvisors.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
contract-extractor = "contract_extractor.extractor.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Anthropic API (opt in with --live; costs a few cents)",
]
